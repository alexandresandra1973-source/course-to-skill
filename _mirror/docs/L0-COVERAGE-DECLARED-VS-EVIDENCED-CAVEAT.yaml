por_que_nao_extrapolo: 'A união de spans declarados não escala linearmente com a união de spans sustentados:
  spans declarados que se sobrepõem colapsam na união, e spans sustentados podem colapsar em proporção
  diferente. Multiplicar 73,5% por 0,51 seria inventar um número.'
risco_para_a_comparacao_do_portao:
  por_que_a_comparacao_ainda_vale: O piso de 73,5% e a cobertura da rodada corrigida usam a MESMA definição
    de métrica, congelada em `cts/coverage.py` e pinada por hash. Comparar dois números igualmente inflados
    continua sendo comparação válida.
  onde_ela_quebra: 'Se o compilador corrigido declarar spans mais APERTADOS que o antigo — plausível,
    porque a extração por segmento produz unidades mais estreitas — a inflação cai, e a cobertura corrigida
    fica SUBESTIMADA em relação ao piso histórico. O portão ficaria mais difícil de passar sem que nada
    tenha piorado. O erro, nesse caso, é conservador: reprova quem merecia passar, não o contrário.'
  o_que_mediria_isso: Aplicar a mesma medição declarado×sustentado às 44 evidências do PILOT-001 histórico
    e às da rodada corrigida, e comparar os dois fatores de inflação. Só então se sabe se a comparação
    do portão é entre iguais.
