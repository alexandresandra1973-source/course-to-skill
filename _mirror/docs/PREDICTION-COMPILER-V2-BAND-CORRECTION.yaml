correcao:
  ponto_refutado: 'A justificativa do regime do meio afirmava que o PILOT-002 exigiu a categoria DEMONSTRACAO_DE_TELA
    "que o PILOT-001 não precisou". FALSO: a categoria é chamada de julgamento do próprio analista, não
    está no spec do compilador, não aparece em nenhuma das 44 evidências, e o source-metadata.yaml do
    PILOT-001 declara screen_demonstration: true.'
  ponto_que_sobrevive: segmentos 6,3% mais longos — medido, mas insuficiente para justificar alargar de
    1,33 para 2,00
  justificativa_substituta: 'O regime do meio permanece, por razão diferente e verdadeira: a VARIÂNCIA
    DE EXECUÇÃO do extractor nunca foi medida. Não sabemos quanto o yield varia entre duas rodadas sobre
    a MESMA entrada — mesma lacuna que o teste-reteste do juiz fechou para o TEST-0007. O regime do meio
    é HEDGE DECLARADO contra variância de instrumento não medida, não correção derivada de diferença medida
    entre as fontes.'
  consequencia_se_cair_no_meio: A leitura deixa de ser "diferença legítima entre corpora" e passa a ser
    "há residual e não sabemos de onde vem". O conserto indicado é MEDIR a variância de execução do extractor
    rodando o mesmo segmento duas vezes.
