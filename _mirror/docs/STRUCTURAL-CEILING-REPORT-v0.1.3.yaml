rationale: Os dois braços diferem apenas por knowledge/decision-rules.yaml e knowledge/workflows.yaml.
  Sondagem de conteúdo mostra que as formas EXECUTÁVEIS dessa metodologia (corpo de regra com conditions/expression;
  passos de workflow com steps/workflow_id) são exclusivas do braço completo, enquanto as MENÇÕES descritivas
  dos mesmos temas sobrevivem em glossary, quality-criteria, principles, questions e anti-patterns. Por
  isso EXECUTION_QUALITY e METHODOLOGY_FIDELITY separam os braços e CONSISTENCY e HUMAN_CHECKPOINT_COMPLIANCE
  empatam — o que coincide com o desenho das âncoras, que colocam a recusa disciplinada em faixa baixa
  nos dois primeiros e em faixa alta nos dois últimos. Como a régua pré-declara as faixas de pontuação
  por perfil de comportamento, a banda de margem fica determinada antes da rodada e o teto estrutural
  é computável sem escores.
