por_que_a_regra_escapou: A regra de fidelidade pede MODEL_INFERENCE quando a claim corrige o literal.
  Ela pegou a negação perdida (EV-0026) e o nome grosseiramente corrompido (Chad GBT → ChatGPT), e escapou
  a diferença de UMA LETRA num nome próprio. É plausível que o modelo nem tenha registrado 'Gardner' como
  erro — leu, reconheceu a entidade e escreveu o nome certo sem perceber que estava corrigindo.
conserto_proposto_NAO_APLICADO:
  onde: prompt do extractor, seção 'Fidelidade ao literal'
  o_que: 'instrução explícita para nome próprio: se o nome na fonte difere do nome conhecido por qualquer
    quantidade de caracteres, isso é correção e exige MODEL_INFERENCE — inclusive uma letra'
  verificador_complementar: a varredura mecânica de nome corrompido já existe e pegou o caso; pode virar
    aviso no rastro, com a âncora de capitalização que a torna robusta entre idiomas
  por_que_NAO_agora: mudar o prompt muda o comportamento do extractor, e a §12 exige que os dois pilotos
    rodem sob a mesma versão congelada. Aplicar agora invalidaria a comparação PILOT-001 × PILOT-002,
    que é o objeto do experimento.
  quando: depois de os dois pilotos terminarem sob o congelamento atual
achado_pilot002_cluster_vercel:
  o_que: A transcrição erra o MESMO nome de produto de quatro maneiras — Versel, Versell, Verscell (2×)
    — e a claim escreve 'Vercel' nas quatro, sem rotular nenhuma como MODEL_INFERENCE.
  casos:
  - EV-0289 Vercel ← Versel
  - EV-0356 Vercel ← Verscell
  - EV-0358 Vercel ← Versell
  - EV-0372 Vercel ← Verscell
  cobertura_da_regra_no_pilot002: 7 de 11 corrupções de nome rotuladas
  leitura_corrigida: 'Isto é INCONSISTÊNCIA, não falha sistemática. Uma falha sistemática — a regra nunca
    pega corrupção de nome — seria previsível e contornável: bastaria varrer todas. O que se observa é
    pior para previsibilidade: o MESMO tipo de item, o mesmo nome de produto no mesmo corpus, às vezes
    é rotulado e às vezes não, sem critério visível. Quem consome o corpus não tem como saber quais registros
    SOURCE_EXPLICIT são confiáveis, porque a fronteira não é uma propriedade do item.'
  taxa_estavel_entre_corpora:
    PILOT-001-v2: 1/149 = 0,7%
    PILOT-002-v2: 4/448 = 0,9%
    leitura: A taxa de dano é estável entre corpora de tamanho e domínio muito diferentes, o que sugere
      propriedade do mecanismo e não do texto.
risco_aceito_conscientemente: O PILOT-002 roda com a mesma lacuna. Se houver corrupção de nome próprio
  no corpus dele, ela pode sair como SOURCE_EXPLICIT. A varredura mecânica roda sobre o resultado e mede
  o tamanho do problema — o que não se pode é consertar no meio.
