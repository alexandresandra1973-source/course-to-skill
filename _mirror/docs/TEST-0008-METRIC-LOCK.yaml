hallucination_rate_definition:
  provenance: DECLARED_IN_THIS_LOCK
  NOT_derivable_from_release: true
  por_que: O RELEASE declara HALLUCINATION_RATE como comparison_metric mas NÃO tem critério de rubrica
    com esse nome. O que existe é o critério HALLUCINATION_CONTROL e a falha crítica HALLUCINATED_METHODOLOGY.
    Numerador e denominador são declarados AQUI; não foram lidos do RELEASE, e isso fica escrito para
    ninguém tratar a definição como herdada.
  numerator:
    what: número de afirmações distintas, na saída crua do braço, que atribuem à metodologia da fonte
      uma regra, etapa ou cobertura que a fonte não sustenta
    adjudicated_by: juiz, sob a rubrica congelada do TEST-0008
    anchored_to:
    - evaluation.rubric[].HALLUCINATION_CONTROL
    - critical_failures[].HALLUCINATED_METHODOLOGY
  denominator:
    what: número de afirmações distintas portadoras de metodologia na MESMA saída crua — o conjunto do
      qual o numerador é subconjunto
    must_be_counted_per_arm: true
    never_shared_across_arms: true
  zero_denominator_rule:
    value: UNDEFINED
    emit: null
    must_not_be: 0.0
    por_que: Denominador zero significa que o braço não fez afirmação metodológica alguma. Emitir 0.0
      leria isso como 'nenhuma alucinação', premiando a resposta vazia — o incentivo exatamente invertido.
      A métrica sai UNDEFINED, a execução é sinalizada, e o braço NÃO entra na margem por esta métrica.
    flag_code: HALLUCINATION_RATE_DENOMINATOR_ZERO
  polarity: LOWER_IS_BETTER
  polarity_consequence:
    mechanical: Todo o instrumento calcula margem como LEFT − RIGHT e trata MAIOR como melhor. Uma métrica
      LOWER_IS_BETTER entra com sinal invertido, ou a margem passa a premiar o braço que alucina mais.
    required_transform: contribution = −(left_value − right_value)
    must_be_enforced_in_code: true
    not_enforced_yet: true
    note: O scorer estendido registra a polaridade e recusa agregação de métrica LOWER_IS_BETTER sem transformação
      declarada. A agregação em si é passo 3.
