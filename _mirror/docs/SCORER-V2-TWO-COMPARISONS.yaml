    got: D=12.0 P−F=12.0 fecha=True
    passed: true
    note: ''
  - case: K6_IDENTIDADE_D_IGUAL_P_MENOS_F
    sub: 'mutante: F subtrai FULL_SKILL'
    expect: REJEITA (identidade não fecha)
    got: D=12.0 P−F=30.0 UNCLOSED
    passed: true
    note: ''
  - case: K6b_NAO_INDEPENDENCIA
    sub: registrada na saída, não só na ADR
    expect: independent=False, shared=SUMMARY_AS_SUMMARY
    got: independent=False shared=SUMMARY_AS_SUMMARY
    passed: true
    note: ''
  - case: K6b_NAO_INDEPENDENCIA
