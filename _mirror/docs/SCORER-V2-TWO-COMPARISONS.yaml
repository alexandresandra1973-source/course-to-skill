      6.0)}'
    got: '{''F'': (''SUMMARY_AS_SKILL'', ''SUMMARY_AS_SUMMARY'', 6.0), ''P'': (''FULL_SKILL'', ''SUMMARY_AS_SUMMARY'',
      18.0)}'
    passed: true
    note: ''
  - case: K2_PARES_CORRETOS
    sub: totais lidos das condições certas
    expect: cada lado lê a sua condição
    got: sim
    passed: true
    note: ''
  - case: K3_TROCA_DE_SELECTOR
    sub: freezer
    expect: REJEITA
    got: COMPARISON_SELECTOR_BINDING_MISMATCH
    passed: true
    note: ''
  - case: K3_TROCA_DE_SELECTOR
    sub: scorer, lock forjado já LOCKED
    expect: REJEITA
    got:
    - COMPARISON_SELECTOR_BINDING_MISMATCH
    passed: true
    note: o lock forjado tem hash próprio; só a ligação no código o pega
  - case: K4_COMPARISON_ID
    sub: ausente (lock plano)
    expect: REJEITA
    got: COMPARISON_ID_MISSING
    passed: true
    note: ''
  - case: K4_COMPARISON_ID
