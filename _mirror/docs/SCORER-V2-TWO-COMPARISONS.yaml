design:
  principio: ENVOLVER, NAO REESCREVER
  validate_comparisons: NAO reestruturada. Ganhou um unico parametro novo, lock_override, que permite
    alimenta-la com um lock sintetizado em memoria. P e F sao calculados chamando A MESMA funcao, uma
    vez por comparacao.
  consequencia_1: o caminho do TEST-0007 executa exatamente o mesmo codigo
  consequencia_2: P e F sao medidos pelo mesmo instrumento POR CONSTRUCAO, nao por disciplina. Metrica
    exclusiva de uma das comparacoes e impossivel de expressar.
  onde_mora_a_identidade_de_P_e_F:
    local: CODIGO (CANONICAL_COMPARISON_SETS), nao o lock
    por_que: um lock e dado, e quem adultera o lock adultera o dado. Trocar os seletores entre P e F inverteria
      o que cada quantidade significa sem mudar um so numero, e o lock adulterado teria o seu proprio
      hash valido. So uma ligacao no codigo pega isso — e o canario K3 prova.
    duplicada_no_freezer: 'de proposito: dois guardas independentes recusam a mesma troca, sem acoplamento'
nao_independencia_de_P_e_F:
  registrada_no_codigo: true
  constante: COMPARISON_INDEPENDENCE
  emitida_na_saida: comparison_dependence
  independent: false
  shared_component: SUMMARY_AS_SUMMARY
  razao: P e F subtraem o MESMO braco de baseline. O erro desse braco e comum as duas, com o mesmo sinal,
    e CANCELA em P - F. Trata-las como independentes subestimaria a variancia de P - F e superestimaria
    a de cada uma isoladamente.
  operacoes_proibidas:
  - somar variancias de P e F como se fossem independentes
  - aplicar correcao de multiplas comparacoes que pressupoe independencia
  - tratar P e F como duas amostras separadas em teste de hipotese
  operacoes_permitidas:
  - publicar P e F separadamente
  - publicar D = P - F, em que o baseline compartilhado cancela
  - publicar F/P e abs(F)/abs(P) quando P != 0
  guarda_executavel: 'contrato que declare treat_comparisons_as_independent: true e REJEITADO com SHARED_BASELINE_INDEPENDENCE_VIOLATION'
identidade_D:
  expressao: D = m(FULL_SKILL) - m(SUMMARY_AS_SKILL) = P - F
  verificada_em_toda_execucao: true
  tolerancia: 0.01
  codigo_de_falha: COMPARISON_IDENTITY_UNCLOSED
  leitura_quando_nao_fecha: erro de SELECAO DE CONDICAO, de SINAL ou de CALCULO — nunca de arredondamento,
    porque o baseline compartilhado cancela algebricamente
registro_de_codigos:
  achado: 'A primeira versao do patch acrescentou os seis codigos novos ao conjunto global INVALIDATION_CODES
    e INVALIDOU O TEST-0007: o contrato congelado enumera o registro e o scorer confere igualdade EXATA
    nos dois sentidos.'
  quem_pegou: o proprio guard do instrumento, no primeiro teste de regressao
  conserto: registro EFETIVO — os codigos da extensao entram so quando um comparison_set e despachado.
    O guard continua fechado; o que mudou foi o conjunto correto a comparar em cada caso.
  nao_foi_afrouxado: true
collect_consumed_run_keys:
  mudanca: percorre todas as comparacoes do conjunto, nao so a definicao plana
  por_que: 'sem isto a TERCEIRA condicao — SUMMARY_AS_SKILL, lado esquerdo de F — sairia acusada como
    UNCONSUMED_RUN_SELECTOR: uma corrida real, medida e usada, denunciada como orfa'
  poder_de_deteccao_provado_por: canario K5, mutante sem a expansao
canary:
  approved: true
  cases_total: 16
  cases_passed: 16
  regra: cada caso roda contra o instrumento real (tem de passar) E contra um mutante ou fixture adulterada
    (tem de reprovar). Fixture adulterada que passa = sem poder de deteccao = suite reprovada.
  cases:
  - case: K1_P_E_F_NA_MESMA_EXECUCAO
    sub: real
    expect: P e F presentes
    got:
    - F
    - P
    passed: true
    note: ''
  - case: K1_P_E_F_NA_MESMA_EXECUCAO
