  - case: K5_TERCEIRA_CONDICAO_CONSUMIDA
    sub: real
    expect: sem UNCONSUMED_RUN_SELECTOR
    got: limpo
    passed: true
    note: ''
  - case: K5_TERCEIRA_CONDICAO_CONSUMIDA
    sub: mutante sem a expansão
