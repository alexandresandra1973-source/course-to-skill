    tentativa_de_conserto: 'Testadas duas versões mais estreitas. A invariante a idioma (só CamelCase
      de nome de produto, tolerante a espaço) cai para 7 de 149 — mas 2 dessas 7 o próprio modelo JÁ rotulou
      MODEL_INFERENCE, e as outras 5 não são correção da fonte: são a claim resolvendo o antecedente de
      um pronome dentro do segmento (OpenClaw, HubSpot), que é a propriedade desejada de claim autocontida.'
    conclusao: Na sua melhor versão o aviso acrescenta ZERO verdadeiro positivo além do que o rótulo do
      modelo já dá, e o que ele acusa a mais é comportamento que queremos. Um verificador assim não é
      ruidoso apenas — é redundante.
