pendencia_estabilidade_do_pass1:
  exigida_por: §12 da ADR — PASS 1 stability question
  estado: NAO_FEITA_NESTA_RODADA
  por_que: O PASS 1 não foi re-executado por modelo. Os 9 segmentos vieram do `temporal-map.yaml` histórico,
    herdados. O compilador v2 persistiu e hasheou esse mapa, como a §6.1 exige, mas persistir um mapa
    herdado não é medir a segmentação.
  consequencia_para_a_leitura: '`segment_count: 9` e `in_comparability_band: true` são VERDADEIROS POR
    CONSTRUÇÃO. Não testam nada. Ler a banda 7–11 como confirmação de estabilidade do PASS 1 seria ler
    como medição o que é tautologia.'
  o_que_a_rodada_de_fato_isolou: Segurar o PASS 1 fixo é o que permite atribuir a diferença de resultado
    ao PASS 2, que é a variável sob teste. A tautologia é efeito colateral de um desenho correto, não
    descuido — mas precisa ficar escrita para ninguém contá-la como evidência.
  manifesto_declara:
    segment_count: 9
    in_comparability_band: true
    temporal_map_sha256: 845cea7df28d1d697cea904f747d0642f937295ab1a67bd5c83e84e88327bf60
    persisted_before_pass2: true
decisao_para_o_pilot002:
  mapa: FIXO, 41 segmentos, o mesmo já apurado
  pass1_reexecutado: false
  razao: 'Mesma razão do PILOT-001: isolar o PASS 2. Se o PASS 1 rodasse de novo, uma diferença de resultado
    entre os dois pilotos poderia vir de segmentação diferente OU de extração diferente, e a comparação
    perderia o poder de separar as duas.'
  consequencia: A contagem de 41 do PILOT-002 também será herdada, e também não testará a estabilidade
    do PASS 1. As duas rodadas ficam comparáveis entre si justamente por isso.
  o_que_isso_NAO_autoriza: Tratar 9 e 41 como medições deterministas. A §12 da ADR já registra que são
    observações de execução única, e esta pendência confirma que continuam sendo.
medicao_separada_que_fecha_a_pendencia:
  o_que: Re-executar o PASS 1 por modelo sobre o MESMO L0, duas ou mais vezes, e comparar a contagem e
    as fronteiras de segmento entre as execuções.
  por_que_e_separada: Ela mede o PASS 1, não o PASS 2. Misturá-la à rodada de aceitação do PASS 2 confundiria
    as duas variáveis — que é exatamente o que o mapa fixo evita.
  pre_requisito_que_ainda_nao_existe: O compilador v2 não tem extractor de PASS 1. Ele consome um temporal-map;
    não o produz. Implementá-lo é trabalho novo, não configuração.
  estado: NAO_AGENDADA
  bloqueia_o_pilot002: false
